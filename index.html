<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看見小宇宙</title>
<meta name="description" content="親子探索小遊戲，附資優班介紹與正式鑑定報名資訊。本活動不是資優鑑定。">
<meta name="theme-color" content="#18243B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   看見小宇宙 v2 ｜ 程式：Claude ｜ 美術：ChatGPT（assets/art/）
   積木：入口(畫面) / 守門(規則) / 地基(單檔+GitHub Pages) / 工具箱(CONFIG)
   ========================================================= */
:root{
  --night:#18243B; --night2:#223150; --night3:#2c3d5f;
  --teal:#73B8A5; --teal-d:#2c6a5b; --teal-l:#d7ede6;
  --gold:#F4CF87; --gold-d:#7a4f0e; --cream:#FFF8EB;
  --ink:#1c2638; --ink2:#44506a; --line:#e2d6bd;
  --warn:#a3402e; --r:16px; --tap:48px;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--cream);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  line-height:1.6;min-height:100vh;overflow-x:hidden}
body.has-wide-art{background:var(--night) url("assets/art/island-wide.webp") center/cover fixed}
button,input,textarea{font:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 頂部列 ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  background:rgba(24,36,59,.94);border-bottom:1px solid #31425f;backdrop-filter:blur(6px)}
.top .sp{flex:1}
.tbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid #3d5072;
  background:var(--night2);color:var(--cream);font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tbtn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.tbtn[hidden]{display:none}

.app{max-width:760px;margin:0 auto;padding:16px 16px 48px}

/* ---------- 面板 ---------- */
.panel{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:18px;margin:14px 0}
.panel.dark{background:var(--night2);color:var(--cream);border:1px solid #344765}
.panel h2{margin:0 0 8px;font-size:1.3rem;line-height:1.4}
.panel h3{margin:0 0 6px;font-size:1.08rem}
.panel p{margin:0 0 10px}
.muted{color:var(--ink2);font-size:.92rem}
.dark .muted{color:#c9d3e3}
.note{font-size:.88rem;color:#d7deea;margin:8px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:var(--tap);
  padding:10px 16px;border-radius:14px;border:2px solid transparent;cursor:pointer;
  font-size:1.05rem;font-weight:700;text-align:center;text-decoration:none;line-height:1.35}
.btn.main{background:var(--gold);color:var(--ink)}
.btn.teal{background:var(--teal);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor;font-weight:500}
.btn.plain{background:#fff;color:var(--ink);border-color:var(--line);font-weight:500}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btns{display:grid;gap:10px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.link{background:none;border:none;color:var(--gold);text-decoration:underline;cursor:pointer;
  min-height:44px;padding:0 6px;font-size:1rem}
.panel .link{color:var(--teal-d)}

/* ---------- 首頁 ---------- */
.hero h1{margin:4px 0 0;font-size:2rem;letter-spacing:.06em;color:var(--gold)}
.hero .sub{margin:0 0 6px;font-size:1.1rem;font-weight:500}
.hero .lead{margin:0;color:#dfe6f1}
.routes{display:grid;gap:10px;margin:14px 0 6px}
.route{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px;
  padding:10px 16px;border-radius:14px;border:none;cursor:pointer;background:var(--cream);color:var(--ink);
  font-size:1.08rem;font-weight:700;text-align:left}
.route small{font-weight:500;color:var(--ink2);font-size:.85rem;white-space:nowrap}
.route.r1{background:var(--gold)} .route.r2{background:var(--teal)} .route.r3{background:var(--cream)}
.homelinks{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.disclaim{font-size:.88rem;color:#d7deea;text-align:center;margin:4px 0 0}
.homeTop{display:grid;gap:8px}
@media (min-width:700px){ .homeTop{grid-template-columns:1fr 1fr;align-items:center} }

/* ---------- 島嶼 ---------- */
.island{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:3/4;max-height:44vh}
@media (min-width:700px){ .island{max-height:none} }
.island .art,.island svg.draw,.island svg.hit{position:absolute;inset:0;width:100%;height:100%}
.island .art{object-fit:contain;opacity:0;transition:opacity .4s}
.island.has-art .art{opacity:1}
.island.has-art svg.draw{display:none}
.hit .spot{cursor:pointer}
.hit .spot:focus-visible rect.hb{stroke:var(--gold);stroke-width:3}
.glow{opacity:0;transition:opacity .8s}
.glow.on{opacity:1}
.lbl rect{fill:rgba(24,36,59,.88)}
.lbl text{fill:#FFF8EB;font-size:11px;font-weight:700}
.lbl.done rect{fill:var(--gold)} .lbl.done text{fill:var(--ink)}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 4s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(2deg)}}

/* ---------- 小光 ---------- */
.guide{display:flex;gap:10px;align-items:flex-end;margin:12px 0}
.mascot{position:relative;width:74px;height:74px;flex:none}
.mascot svg,.mascot img{position:absolute;inset:0;width:100%;height:100%}
.mascot img{object-fit:contain;opacity:0}
.mascot.has-art img{opacity:1} .mascot.has-art svg{display:none}
.bubble{position:relative;background:var(--cream);color:var(--ink);border-radius:16px;padding:10px 14px;flex:1}
.bubble:before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--cream);border-left:0}
.bubble b{display:block;font-size:.8rem;color:var(--teal-d)}
.peek{animation:peek .6s ease-out}
@keyframes peek{from{transform:translateY(12px);opacity:0}}

/* ---------- 場景橫幅 ---------- */
.scene{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;background:linear-gradient(160deg,#2c3d5f,#18243B 70%);margin-top:6px}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.scene.has-art img{opacity:1}
.scene .stitle{position:absolute;left:12px;bottom:10px;background:rgba(255,248,235,.95);color:var(--ink);
  padding:4px 12px;border-radius:10px;font-weight:700;font-size:1.05rem}
.scene svg.fb{position:absolute;inset:0;width:100%;height:100%}
.scene.has-art svg.fb{display:none}

/* ---------- 家長卡 ---------- */
.prog{font-size:.9rem;color:var(--ink2);margin-bottom:6px}
.pcard .pic{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--teal-l);margin-bottom:12px}
.pcard .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.pcard .pic.has-art img{opacity:1}
.pcard .pic .fbx{position:absolute;inset:0;display:grid;place-items:center;font-size:4.2rem}
.pcard .pic.has-art .fbx{display:none}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);
  font-size:1.05rem;cursor:pointer;text-align:left;padding:8px 14px;display:flex;align-items:center;gap:10px}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--teal-d);background:var(--teal-l);font-weight:700}
.opt[aria-pressed="true"] .dot,.opt[aria-checked="true"] .dot{background:var(--teal-d);border-color:var(--teal-d);box-shadow:inset 0 0 0 3px #fff}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal-d);font-weight:700;margin-right:6px}
.tag.gold{background:#fbe8c2;color:var(--gold-d)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:none}

/* ---------- 站點選擇 ---------- */
.stations{display:grid;gap:10px}
.station{display:flex;gap:12px;align-items:center;min-height:72px;padding:10px 14px;border-radius:14px;border:none;
  background:var(--cream);color:var(--ink);cursor:pointer;text-align:left;font-size:1rem}
.station .ic{font-size:1.9rem;width:44px;text-align:center;flex:none}
.station b{display:block;font-size:1.08rem}
.station .st{margin-left:auto;font-size:.82rem;white-space:nowrap}

/* ---------- 遊戲一：軌道 ---------- */
.board{width:100%;max-width:420px;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.board .cell{cursor:pointer}
.board .cellbg{fill:#f3ead6;stroke:#cdbd9b;stroke-width:2}
.board .cell:focus-visible .cellbg{stroke:var(--gold-d);stroke-width:5}
.rail{fill:none;stroke:#6b4a2a;stroke-width:9;stroke-linecap:round}
.rail2{fill:none;stroke:#c99a4a;stroke-width:3;stroke-linecap:round}
.board .ghost{opacity:.4}
.board .stopbox{fill:none;stroke:var(--warn);stroke-width:6;stroke-dasharray:10 6}
.board .stopar{fill:var(--warn)}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tool{min-height:64px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.95rem;gap:2px;padding:6px}
.tool svg{width:34px;height:34px}
.tool[aria-pressed="true"]{border-color:var(--teal-d);background:var(--teal-l);font-weight:700}
.fb{min-height:1.6em;font-weight:700;margin:8px 0}
.fb.ok{color:var(--teal-d)} .fb.stop{color:var(--warn)}
.hintbox{background:#fbf0d8;border-radius:12px;padding:10px 14px;margin:10px 0;color:var(--ink)}

.lit .rail{stroke:#c98a1f} .lit .rail2{stroke:#fff3c4}
.deco{pointer-events:none}
.pill{display:flex;justify-content:center;align-items:center;gap:8px;font-size:1.6rem;background:#fff;color:var(--ink);border-radius:999px;padding:4px 16px;margin:6px auto 10px;width:max-content;max-width:100%;border:2px solid var(--line);line-height:1.4}
.pill span{font-size:1.1rem;color:var(--ink2)}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#d8ccb3}
.dots i.cur{outline:2px solid var(--teal-d);outline-offset:2px}
.dots i.on{background:var(--teal-d)}
.shopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.shopt{aspect-ratio:1;min-height:88px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;padding:6px}
.shopt svg{width:72%;height:72%}
.shopt.right{border-color:var(--teal-d);background:var(--teal-l)}
.shopt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.stones{width:100%;display:block;border-radius:12px}
.cross .fluffMove{animation:cross 2.2s ease-in-out forwards}
@keyframes cross{to{transform:translateX(322px)}}
.cross .fluffHop{animation:hop .36s ease-in-out 6}
@keyframes hop{50%{transform:translateY(-16px)}}
.sky{width:100%;max-width:440px;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.sky .star{cursor:pointer}
.sky .star .core{fill:#8fa0bf;stroke:#FFF8EB;stroke-width:1}
.sky .star.lit .core{fill:#FFF3C4;stroke:#F4CF87;stroke-width:2}
.sky .star .halo{fill:#F4CF87;opacity:0}
.sky .star.lit .halo{opacity:.35}
.sky .star:focus-visible .ring{stroke:var(--gold);stroke-width:3}
.sky.wrong{animation:shake .4s}
ol.tl{list-style:none;padding:0;margin:0 0 4px}
ol.tl li{display:flex;gap:12px;padding:2px 0}
ol.tl b{min-width:3em;color:var(--teal-d)}
/* ---------- 遊戲二：工坊 ---------- */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.chip{min-height:96px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.92rem;padding:6px;text-align:center}
.chip .ti{position:relative;width:46px;height:46px}
.chip .ti img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.chip .ti.has-art img{opacity:1}
.chip .ti .e{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem}
.chip .ti.has-art .e{display:none}
.chip[aria-pressed="true"]{border-color:var(--teal-d);background:var(--teal-l);font-weight:700}
textarea{width:100%;min-height:88px;border-radius:12px;border:2px solid var(--line);padding:10px;color:var(--ink);background:#fff;resize:vertical}
.count{text-align:right;font-size:.85rem;color:var(--ink2)}
.river{width:100%;display:block;border-radius:12px}
.river .fluff,.river .plank,.river .boatg,.river .ropeF{transform-box:fill-box}
.play .plank{transform-origin:0 50%;animation:plank 1s ease-out both}
@keyframes plank{from{transform:scaleX(0)}}
.play.m-bridge .walker{animation:walkB 2.6s 1s ease-in-out both}
@keyframes walkB{to{transform:translateX(220px)}}
.play.m-boat .boatg{animation:boat 3s .3s ease-in-out both}
@keyframes boat{to{transform:translateX(200px)}}
.play.m-rope .ropeF{animation:rope 2.6s .5s ease-in-out both}
@keyframes rope{to{transform:translateX(210px)}}
.reduce .play *{animation-duration:0s!important;animation-delay:0s!important}
.proposal{background:#fff;border:2px dashed var(--teal-d);border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap;word-break:break-word}

/* ---------- 遊戲三：觀星臺 ---------- */
.plants{width:100%;max-width:440px;display:block;margin:0 auto}
.clues{display:grid;gap:8px;margin:10px 0}
.clue{border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left;cursor:pointer;
  padding:10px 14px;min-height:52px;font-size:1rem}
.clue .ct{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.clue .cd{margin-top:6px;color:var(--ink)}
.clue[aria-expanded="true"]{border-color:var(--teal-d);background:#f2faf7}

/* ---------- 親子提示 ---------- */
.ptip{border-left:6px solid var(--teal);background:#eef7f3;color:var(--ink);border-radius:10px;padding:10px 14px;margin:12px 0}
.ptip b{display:block;color:var(--teal-d);font-size:.88rem}

/* ---------- 紀念卡 ---------- */
.memo{background:var(--cream);color:var(--ink);border-radius:20px;padding:20px;border:3px solid var(--gold);position:relative}
.memo h2{margin:0;font-size:1.35rem;color:var(--night)}
.memo .stamp{font-size:.82rem;color:var(--ink2);margin:2px 0 10px}
.memo section{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.memo h3{margin:0 0 4px;font-size:1rem;color:var(--teal-d)}
.memo ul{margin:0;padding-left:1.2em}
.memo .free{background:#fff;border-radius:8px;padding:6px 10px;margin:4px 0;white-space:pre-wrap;word-break:break-word}
.lamps{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.lamp{width:46px;text-align:center;font-size:.72rem;color:#c9d3e3}
.lamp i{display:block;width:30px;height:30px;margin:0 auto 2px;border-radius:50%;background:#3a4b6b;border:2px solid #56688a}
.lamp.on i{background:radial-gradient(circle,#fff6d8,#F4CF87 60%,#d9a441);border-color:#F4CF87;box-shadow:0 0 14px #F4CF87}
.lamp.on{color:var(--gold)}

/* ---------- 課程與報名 ---------- */
.course{display:grid;gap:10px}
.cpic{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#e8efe9,#e8efe9 10px,#f4f8f5 10px,#f4f8f5 20px)}
.cpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cpic .pend{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:.9rem;text-align:center;padding:8px}
table.info{width:100%;border-collapse:collapse;font-size:1rem}
table.info th,table.info td{text-align:left;vertical-align:top;padding:10px 6px;border-bottom:1px solid var(--line)}
table.info th{width:34%;color:var(--ink2);font-weight:500;font-size:.92rem}
.pending{color:var(--warn);font-weight:700}
.status{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.95rem;margin-bottom:8px}
.status.wait{background:#fbe8c2;color:var(--gold-d)}
.status.open{background:var(--teal-l);color:var(--teal-d)}
.status.close{background:#eedfdc;color:var(--warn)}
.foot{text-align:center;font-size:.82rem;color:#aab6ca;margin-top:24px}
.preview-flag{position:fixed;left:8px;bottom:8px;z-index:30;background:var(--warn);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:6px;opacity:.85;pointer-events:none}

/* ---------- 對話框 ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.7);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .panel{max-width:420px;width:100%}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.switch button{min-width:80px;min-height:44px;border-radius:999px;border:2px solid var(--ink2);background:#fff;color:var(--ink);cursor:pointer;font-weight:700}
.switch button[aria-pressed="true"]{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.errbox{position:fixed;right:8px;bottom:8px;z-index:60;background:#fff;color:var(--warn);border:2px solid var(--warn);border-radius:10px;padding:6px 10px;font-size:.8rem;max-width:80vw}
.errbox[hidden]{display:none}

.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:landscape) and (max-height:520px){
  .island{max-height:none;max-width:300px}
  .homeTop{grid-template-columns:1fr 1fr;align-items:center}
}
</style>
</head>
<body>
<header class="top" role="banner">
  <button class="tbtn" id="btnBack" type="button" aria-label="上一頁">‹ 上一頁</button>
  <button class="tbtn" id="btnIsland" type="button" aria-label="返回島嶼">🏝️ 島嶼</button>
  <span class="sp"></span>
  <button class="tbtn" id="btnSet" type="button" aria-label="設定：聲音、動態、字級">⚙️</button>
  <button class="tbtn gold" id="btnEnroll" type="button">鑑定與報名</button>
</header>
<main class="app" id="main" tabindex="-1"></main>
<div class="sr" aria-live="polite" id="live"></div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="panel" id="modalBody"></div>
</div>
<div class="errbox" id="errbox" hidden role="alert"></div>

<script>
/* =========================================================
   工具箱：CONFIG ── 年度更新只改這一區，不必動遊戲程式
   ========================================================= */
const CONFIG = {
  version: 'v2',
  preview: false,          // true＝開發預覽：顯示待填標記
  school: {
    name: '高雄市莒光國小',
    eligibility: '設籍本市之國小二、四年級學生',
    timeline: [ ['1月','報名'], ['3月','初選'], ['4月','複選'] ],
    timelineNote: '實際日期仍須視每年簡章而定',
    brochureUrl: '',                  // 官方簡章連結；填了就會變成「閱讀正式簡章」按鈕

let actx=null, bgm=null;
try{ bgm = new Audio(); bgm.loop = true; bgm.volume = .35; bgm.preload='none'; }catch(e){ bgm=null; }
function chime(ok){
  if(!PREF.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880,1100] : [440,370];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime+i*.12; g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.15,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
      o.start(t); o.stop(t+.32);
    });
  }catch(e){}
}
function startBgm(){
  if(!bgm || !PREF.sound) return;
  if(!bgm.src){ bgm.src = CONFIG.bgm; bgm.onerror = ()=>{}; }
  const p = bgm.play(); if(p && p.catch) p.catch(()=>{});
}

let hist = [];
function go(screen, opt){
  opt = opt || {};
  if(S.screen==='g3' && screen!=='g3'){ g3Clear(); g3Phase='idle'; g3Input=[]; }
  if(opt.push !== false && S.screen && S.screen !== screen) hist.push(S.screen);
  if(hist.length>30) hist.shift();
  S.screen = screen; save(); render();
  window.scrollTo(0,0);
  if(!opt.noFocus) main.focus({preventScroll:true});
}
function back(){
  if(S.screen==='g3'){ g3Clear(); g3Phase='idle'; g3Input=[]; }
  const p = hist.pop();
  S.screen = p || 'home'; save(); render(); window.scrollTo(0,0);
}
function render(){
  try{
    const f = SCREENS[S.screen] || SCREENS.home;
    main.innerHTML = f();
    $('#btnBack').hidden = (S.screen==='home');
    $('#btnIsland').hidden = (S.screen==='home');
    $('#btnEnroll').hidden = (S.screen==='enroll');
    if(AFTER[S.screen]) AFTER[S.screen]();
  }catch(e){ showErr('R', e); }
}

/* =========================================================
   守門：遊戲一 機關修理所（轉軌道・空間推理）
   方向 0北 1東 2南 3西；直軌 r0=東西 r1=南北；彎軌 r0=北東 r1=東南 r2=南西 r3=西北
   ========================================================= */
const DR = [[-1,0],[0,1],[1,0],[0,-1]];
function openings(p){ return p.t==='s' ? (p.r%2===0?[1,3]:[0,2]) : [p.r%4,(p.r+1)%4]; }
function simulate(board){
  let r=0,c=0,entry=3; const path=[];
  for(let step=0; step<20; step++){
    const p = board[r][c];
    if(!p) return { ok:false, reason:'empty', stop:[r,c], entry, path };
    const o = openings(p);
    if(o.indexOf(entry)<0) return { ok:false, reason:'mismatch', stop:[r,c], entry, path };
    const exit = o[0]===entry ? o[1] : o[0];
    path.push({ r, c, entry, exit });
    const nr=r+DR[exit][0], nc=c+DR[exit][1];
    if(nr<0||nr>2||nc<0||nc>2){
      if(r===2 && c===2 && exit===1) return { ok:true, path };
      return { ok:false, reason:'edge', stop:[r,c], exit, path };
    }
    r=nr; c=nc; entry=(exit+2)%4;
  }
  return { ok:false, reason:'loop', stop:[r,c], path };
}
// 每關：零件 [列, 行, 種類, 正確方向]、開局方向、裝飾格
const G1_LEVELS = [
  { pieces:[[0,0,'s',0],[0,1,'s',0],[0,2,'c',2],[1,2,'s',1],[2,2,'c',0]], start:[1,0,0,0,3],
    deco:[[1,0,'rock'],[2,0,'flower'],[1,1,'flower'],[2,1,'rock']] },
  { pieces:[[0,0,'c',2],[1,0,'c',0],[1,1,'c',2],[2,1,'c',0],[2,2,'s',0]], start:[1,2,3,1,1],
    deco:[[0,1,'flower'],[0,2,'rock'],[1,2,'flower'],[2,0,'rock']] }
];
let g1Last = null, g1Anim = false;
function g1Init(level){ S.g1.level = level; S.g1.rot = G1_LEVELS[level].start.slice(); S.g1.hint = 0; g1Last = null; }
function g1Board(rotOverride){
  const L = G1_LEVELS[S.g1.level], b = emptyBoard();
  L.pieces.forEach((p,i)=>{ b[p[0]][p[1]] = { t:p[2], r:(rotOverride||S.g1.rot)[i] }; });
  return b;
}
function g1Wrong(){ // 沿路線順序，第一塊方向不對的零件
  const L = G1_LEVELS[S.g1.level];
  for(let i=0;i<L.pieces.length;i++){
    const p=L.pieces[i], mod = p[2]==='s'?2:4;
    if(S.g1.rot[i]%mod !== p[3]%mod) return i;
  }
  return -1;
}
function railSVG(p, cls){
  const inner = p.t==='s'
    ? `<line x1="0" y1="50" x2="100" y2="50" class="rail"/><line x1="0" y1="50" x2="100" y2="50" class="rail2"/>${[15,38,62,85].map(x=>`<rect x="${x-3}" y="38" width="6" height="24" fill="#8a6a3a"/>`).join('')}`
    : `<path d="M50 0 A50 50 0 0 0 100 50" class="rail"/><path d="M50 0 A50 50 0 0 0 100 50" class="rail2"/>`;
  return `<g transform="rotate(${p.r*90} 50 50)" class="${cls||''}">${inner}</g>`;
}
function decoSVG(k){
  return k==='rock'
    ? `<ellipse cx="50" cy="62" rx="26" ry="16" fill="#8b93a3"/><ellipse cx="42" cy="56" rx="10" ry="5" fill="#a9b0bd"/>`
    : `<line x1="50" y1="72" x2="50" y2="46" stroke="#3f8a74" stroke-width="4"/>${[0,72,144,216,288].map(a=>`<circle cx="${50+9*Math.cos(a*Math.PI/180)}" cy="${40+9*Math.sin(a*Math.PI/180)}" r="7" fill="#e9a3b8"/>`).join('')}<circle cx="50" cy="40" r="5" fill="#F4CF87"/>`;
}
function g1BoardSVG(){
  const L = G1_LEVELS[S.g1.level], b = g1Board(), live = simulate(b);
  const litCells = {}; live.path.forEach(p=>{ litCells[p.r+','+p.c]=1; });
  const solved = S.g1.solved[S.g1.level];
  let cells = '';
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    const p = b[r][c];
    if(p){
      const desc = p.t==='s' ? (p.r%2===0?'直軌，左右方向':'直軌，上下方向') : ['彎軌，上到右','彎軌，右到下','彎軌，下到左','彎軌，左到上'][p.r];
      cells += `<g class="cell" role="button" tabindex="0" data-act="cell" data-r="${r}" data-c="${c}" aria-label="第${r+1}排第${c+1}格，${desc}，點一下轉方向" transform="translate(${c*100} ${r*100})">

  if(showMark){

    if(S.g1.hint>=2) mark += `<g transform="translate(${p[1]*100} ${p[0]*100})" class="ghost" pointer-events="none">${railSVG({t:p[2],r:p[3]})}</g>`;
  }
  return `<svg class="board" id="board" viewBox="-60 -20 420 340" role="group" aria-label="三乘三軌道方格">
    <rect x="-60" y="-20" width="420" height="340" fill="#22314d" rx="14"/>

    <g aria-hidden="true" transform="translate(300 220)">
      <rect x="12" y="20" width="24" height="70" fill="#FFF8EB"/><rect x="12" y="40" width="24" height="10" fill="#c0503f"/><rect x="12" y="66" width="24" height="10" fill="#c0503f"/>
      <rect x="8" y="10" width="32" height="14" rx="3" fill="#44506a"/>
      <circle cx="24" cy="12" r="${solved?22:8}" fill="${solved?'#F4CF87':'#5d6b85'}" opacity="${solved?.9:1}"/>
    </g>
    ${cells}${mark}
    <g id="car" aria-hidden="true" transform="translate(${solved?'340 250':'-30 50'})"><circle r="14" fill="#F4CF87" stroke="#8a5a12" stroke-width="2"/><path d="M0 -8 L2.4 -2.4 L8 -2.4 L3.6 1.2 L5.2 7 L0 3.6 L-5.2 7 L-3.6 1.2 L-8 -2.4 L-2.4 -2.4z" fill="#fff"/></g>

function dots(n, cur, done){ return `<div class="dots" aria-label="第 ${cur+1} 關，共 ${n} 關">${Array.from({length:n},(_,i)=>`<i class="${i<cur||(i===cur&&done)?'on':''} ${i===cur?'cur':''}"></i>`).join('')}</div>`; }

SCREENS.g1 = () => {
  const g = S.g1, solved = g.solved[g.level], last = g.level===G1_LEVELS.length-1;

      : `<div class="btns two"><button class="btn main" data-act="g1run" ${g1Anim?'disabled':''} aria-label="出發">▶️ 出發</button>
         <button class="btn ghost" data-act="g1hint" ${g.hint>=2?'disabled':''} aria-label="提示">💡 提示</button></div>`}

  ${!g.done ? `<div class="btns"><button class="link" data-act="skipst" data-st="g1">略過這一站</button></div>` : ''}`;

function carPoints(path){
  const pts = [[-30,50]];
  const mid = (r,c,d)=>[c*100+50+DR[d][1]*50, r*100+50+DR[d][0]*50];
  path.forEach(s=>{
    const a = mid(s.r,s.c,s.entry), b = mid(s.r,s.c,s.exit);
    pts.push(a);
    if((s.entry+2)%4===s.exit){ pts.push([s.c*100+50, s.r*100+50]); }
    else {
      const cx = s.c*100 + (a[0]+b[0]-2*(s.c*100+50)>0?100:0);
      const cy = s.r*100 + (a[1]+b[1]-2*(s.r*100+50)>0?100:0);
      const ccx=s.c*100+50, ccy=s.r*100+50, L=Math.hypot(ccx-cx,ccy-cy);
      pts.push([cx+(ccx-cx)*50/L, cy+(ccy-cy)*50/L]);
    }
    pts.push(b);
  });
  return pts;
}
function runG1(){
  if(g1Anim || S.g1.solved[S.g1.level]) return;
  const res = simulate(g1Board());
  S.g1.runs++;
  const pts = carPoints(res.path);
  if(res.ok) pts.push([340,250]);
  const finish = ()=>{
    g1Anim = false;
    if(res.ok){
      S.g1.solved[S.g1.level] = true;
      if(S.g1.level===G1_LEVELS.length-1){ S.g1.done = true; delete S.skipped.g1; }
      chime(true); say('到站了！');
    } else { chime(false); say('星星停住了。'); }
    g1Last = res; save(); render();
    const car=$('#car'); if(car && !res.ok){ const e=pts[pts.length-1]; car.setAttribute('transform',`translate(${e[0]} ${e[1]})`); }
  };
  g1Last = null; g1Anim = true; render();
  const car = $('#car');
  if(PREF.reduce || !car){ finish(); return; }
  let i=0; const seg=150;
  (function step(){
    if(i>=pts.length-1){ setTimeout(finish,120); return; }
    const a=pts[i], b=pts[i+1], t0=performance.now();
    (function fr(now){
      const k=Math.min(1,(now-t0)/seg);
      car.setAttribute('transform',`translate(${a[0]+(b[0]-a[0])*k} ${a[1]+(b[1]-a[1])*k})`);
      if(k<1) requestAnimationFrame(fr); else { i++; step(); }
    })(t0);
  })();
}
function tapCell(r,c){
  if(g1Anim || S.g1.solved[S.g1.level]) return;
  const L = G1_LEVELS[S.g1.level], i = L.pieces.findIndex(p=>p[0]===r&&p[1]===c);
  if(i<0) return;
  S.g1.rot[i] = (S.g1.rot[i]+1) % (L.pieces[i][2]==='s'?2:4);
  g1Last = null; save(); render();
  const el = document.querySelector(`[data-act="cell"][data-r="${r}"][data-c="${c}"]`); if(el) el.focus();
}

const G2_ROUNDS = [

   ========================================================= */
const STARS = [[62,58],[160,36],[258,64],[92,150],[192,128],[272,168]];
const G3_ROUNDS = [[0,3,4],[1,4,2,5],[5,3,0,1,4]];
let g3Phase = 'idle', g3Input = [], g3Timer = [];
function g3Clear(){ g3Timer.forEach(clearTimeout); g3Timer = []; }
function skySVG(){
  const g = S.g3, seq = G3_ROUNDS[Math.min(g.round,G3_ROUNDS.length-1)], solved = g.roundSolved;
  const pathIdx = solved ? seq : g3Input;
  const line = pathIdx.length>1 ? `<polyline points="${pathIdx.map(i=>STARS[i].join(',')).join(' ')}" fill="none" stroke="#F4CF87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>` : '';
  const bg = Array.from({length:30},(_,i)=>`<circle cx="${(i*67)%320}" cy="${(i*43)%220}" r="${i%4?0.8:1.3}" fill="#FFF8EB" opacity=".6"/>`).join('');
  return `<svg class="sky" id="sky" viewBox="0 0 320 220" role="group" aria-label="夜空裡的六顆星星">
    <rect width="320" height="220" rx="14" fill="#101a2e"/>${bg}${line}
    ${STARS.map((p,i)=>`<g class="star ${solved&&seq.indexOf(i)>=0?'lit':''}" data-star="${i}" data-act="g3tap" data-i="${i}" role="button" tabindex="0" aria-label="第 ${i+1} 顆星星">
      <circle cx="${p[0]}" cy="${p[1]}" r="28" fill="transparent" class="ring" stroke="none"/>
      <circle cx="${p[0]}" cy="${p[1]}" r="22" class="halo"/>
      <path class="core" d="M${p[0]} ${p[1]-14} L${p[0]+4} ${p[1]-4} L${p[0]+14} ${p[1]-4} L${p[0]+6} ${p[1]+3} L${p[0]+9} ${p[1]+13} L${p[0]} ${p[1]+7} L${p[0]-9} ${p[1]+13} L${p[0]-6} ${p[1]+3} L${p[0]-14} ${p[1]-4} L${p[0]-4} ${p[1]-4}Z"/>
    </g>`).join('')}
  </svg>`;
}
function g3Light(i, on){ const el = document.querySelector(`[data-star="${i}"]`); if(el) el.classList.toggle('lit', on); }
function g3Play(){
  if(g3Phase==='show' || S.g3.roundSolved) return;
  g3Clear(); g3Input = []; g3Phase = 'show'; S.g3.views++; save(); render();
  const seq = G3_ROUNDS[S.g3.round], on = 600, gap = 250;
  seq.forEach((idx,k)=>{
    g3Timer.push(setTimeout(()=>g3Light(idx,true), 400 + k*(on+gap)));
    g3Timer.push(setTimeout(()=>g3Light(idx,false), 400 + k*(on+gap) + on));
  });
  g3Timer.push(setTimeout(()=>{ g3Phase='input'; render(); say('換你點了'); }, 400 + seq.length*(on+gap)));
}
function g3Tap(i){
  if(g3Phase!=='input' || S.g3.roundSolved) return;
  const seq = G3_ROUNDS[S.g3.round];
  g3Input.push(i);
  if(seq[g3Input.length-1] !== i){
    g3Input = []; g3Phase = 'idle'; chime(false); render();
    const sk=$('#sky'); if(sk){ sk.classList.add('wrong'); setTimeout(()=>sk.classList.remove('wrong'),450); }
    say('順序不一樣，再看一次吧');
    return;
  }
  if(g3Input.length === seq.length){
    S.g3.roundSolved = true; S.g3.best = Math.max(S.g3.best, seq.length);
    if(S.g3.round===G3_ROUNDS.length-1){ S.g3.done = true; delete S.skipped.g3; }
    g3Phase = 'idle'; g3Input = []; save(); chime(true); render(); say('全部記住了！');
    return;
  }
  render();
  g3Light(i,true); setTimeout(()=>g3Light(i,false), 300);
  const el = document.querySelector(`[data-star="${i}"]`); if(el) el.focus();
}
SCREENS.g3 = () => {
  const g = S.g3, n = G3_ROUNDS.length, last = g.round===n-1, seq = G3_ROUNDS[Math.min(g.round,n-1)];
  let btn = '';
  if(g.roundSolved) btn = last ? `<button class="btn main" data-act="next" data-st="g3">下一站 ➜</button>` : `<button class="btn main" data-act="g3next">下一片星空 ➜</button>`;
  else if(g3Phase==='show') btn = `<button class="btn main" disabled>👀 看仔細…</button>`;
  else if(g3Phase==='input') btn = `<button class="btn ghost" data-act="g3play">🔁 再看一次</button>`;
  else btn = `<button class="btn main" data-act="g3play">${g.views>0?'🔁 再看一次':'▶️ 看星星'}</button>`;
  const fb = g.roundSolved ? (last?'🌟 星座連起來了！':'✔️ 全部記住了！') : g3Phase==='input' ? `👆 ${g3Input.length}／${seq.length}` : '';
  return `${sceneBanner('線索觀星臺', STATIONS.g3.art, '#1f2c48')}
  ${guide('星星會一顆一顆亮。看仔細，再照順序點一次！', g.roundSolved?'happy':'think')}
  <div class="panel">
    ${dots(n, g.round, g.roundSolved)}
    <div class="pill" aria-label="玩法：先看星星亮的順序，再照順序點星星">👀<span>➜</span>⭐⭐⭐<span>➜</span>👆</div>
    ${skySVG()}
    <div class="fb ok" aria-live="polite">${fb}</div>
    <div class="btns">${btn}</div>
  </div>
  ${S.route==='together' && g.done ? ptip('g3') : ''}
  ${!g.done ? `<div class="btns"><button class="link" data-act="skipst" data-st="g3">略過這一站</button></div>`:''}`;
};

/* ---------- 探索紀念卡 ---------- */
function memoData(){
  const parent = seenList().map(x=>`${x.v}：${x.c.t}`);
  const did = [], talk = [];
  const nums = ['一','二','三','四','五'];
  S.g1.solved.forEach((v,i)=>{ if(v) did.push(`修好第${nums[i]}關的軌道`); });
  if(S.g1.runs>0) did.push(`試跑了 ${S.g1.runs} 次`);
  if(S.g1.hintUsed) did.push('打開了提示');
  const n2 = S.g2.solvedCount;
  if(n2>0) did.push(`鋪好 ${n2} 顆踏石${S.g2.done?'，毛球過河了':''}`);
  if(S.g3.best>0) did.push(`記住 ${S.g3.best} 顆星星亮起的順序`);
  if(S.cardsDone && (S.route!=='child')) talk.push(TALK.cards);
  ['g1','g2','g3'].forEach(k=>{ if(S[k].done) talk.push(TALK[k]); });
  return { parent, did, free:[], talk, showParent: S.cardsDone || S.cards.some(x=>x) };
}

    <section><p class="muted" style="margin:0">短短幾個任務，只能看見今天的一小部分。孩子的興趣、經驗與需要，可以在生活裡繼續了解。</p></section>

/* =========================================================
   動作分派
   ========================================================= */
function nextStation(cur){
  if(cur) S.skipped[cur] = S.skipped[cur] && !S[cur].done;
  const left = ['g1','g2','g3'].filter(k=>!S[k].done && !S.skipped[k] && k!==cur);
  go(left.length ? left[0] : 'memento');
}
function startRoute(){
  if(S.route==='parent' || S.route==='together'){ S.cardIdx = 0; go('cards'); }
  else go('picker');
}
function finishCards(){
  S.cardsDone = true; delete S.skipped.cards; save(); go('parentResult');
}
function confirmRestart(){
  modal(`<h2 id="modalTitle">重新開始？</h2><p>這次的選擇和作答會全部清除，沒辦法復原。</p>
    <div class="btns two"><button class="btn plain" data-act="mclose">先不要</button><button class="btn main" data-act="doRestart">清除並重來</button></div>`);
}
function modal(html){ $('#modalBody').innerHTML = html; $('#modal').hidden = false; const b=$('#modalBody button'); if(b) b.focus(); }
function closeModal(){ $('#modal').hidden = true; }
function openSettings(){
  const sw = (k,label,desc)=>`<div class="switch"><span>${label}<br><span class="muted">${desc}</span></span><button data-act="pref" data-k="${k}" aria-pressed="${!!PREF[k]}">${PREF[k]?'開':'關'}</button></div>`;
  modal(`<h2 id="modalTitle">設定</h2>
    ${sw('sound','聲音','提示音與配樂，預設關閉')}
    ${sw('reduce','減少動態','關掉動畫，直接顯示結果')}
    ${sw('big','大字模式','放大所有文字')}
    <div class="btns"><button class="btn main" data-act="mclose">完成</button></div>`);
}

function act(el){
  const a = el.dataset.act;
  switch(a){
    case 'route': S.route = el.dataset.r; save(); go('intro'); break;
    case 'start': startRoute(); break;
    case 'go': go(el.dataset.to); break;
    case 'spot': {
      const to = el.dataset.to;
      if(!S.route) S.route = to==='cards' ? 'parent' : 'child';
      if(to==='cards'){ S.cardIdx = S.cardsDone?0:S.cardIdx; }
      save(); go(to); break; }
    case 'tochild': S.route='child'; save(); go('picker'); break;
    case 'memento': go('memento'); break;
    case 'restart': confirmRestart(); break;
    case 'doRestart': { const r=S.route; S = fresh(); g1Last=null; g3Clear(); g3Phase='idle'; hist=[]; save(); closeModal(); go('home',{push:false}); break; }
    case 'mclose': closeModal(); break;
    case 'pref': PREF[el.dataset.k] = !PREF[el.dataset.k]; savePref(); if(el.dataset.k==='sound' && PREF.sound) startBgm(); openSettings(); render(); break;

    case 'cardpick': S.cards[S.cardIdx] = el.dataset.v; save(); render(); { const b=document.querySelector('[data-act="cardnext"]'); if(b) b.focus(); } break;
    case 'cardnext': if(S.cardIdx>=5) finishCards(); else { S.cardIdx++; save(); render(); main.focus(); } break;
    case 'cardprev': if(S.cardIdx>0){ S.cardIdx--; save(); render(); main.focus(); } break;
    case 'cardskip': S.cards[S.cardIdx] = null; if(S.cardIdx>=5) finishCards(); else { S.cardIdx++; save(); render(); main.focus(); } break;

    case 'skipst': {
      const st = el.dataset.st;
      S.skipped[st] = true; save();
      if(st==='cards'){ S.cardsDone = false; save(); if(S.route==='together') go('picker'); else go('parentResult'); }
      else nextStation(st);
      break; }
    case 'next': nextStation(el.dataset.st); break;

    case 'cell': tapCell(+el.dataset.r, +el.dataset.c); break;
    case 'g1run': runG1(); break;
    case 'g1hint': S.g1.hint = Math.min(2, S.g1.hint+1); S.g1.hintUsed = true; save(); render(); break;
    case 'g1next': g1Init(S.g1.level+1); save(); render(); main.focus(); break;

    case 'g2pick': {
      const R = G2_ROUNDS[S.g2.round];
      if(el.dataset.k===R.ans){
        S.g2.roundSolved = true; S.g2.solvedCount = Math.max(S.g2.solvedCount, S.g2.round+1);
        if(S.g2.round===G2_ROUNDS.length-1){ S.g2.done = true; delete S.skipped.g2; }
        save(); chime(true); render(); say('答對了，毛球跳過去了');
      } else {
        chime(false); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); say('再看一次石頭的樣子');
      }
      break; }
    case 'g2next': S.g2.round++; S.g2.roundSolved = false; save(); render(); main.focus(); break;

    case 'g3play': g3Play(); break;
    case 'g3tap': g3Tap(+el.dataset.i); break;
    case 'g3next': g3Clear(); g3Phase='idle'; g3Input=[]; S.g3.round++; S.g3.roundSolved=false; S.g3.views=0; save(); render(); main.focus(); break;

    case 'download': downloadMemo(); break;
  }
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  try{ act(el); }catch(err){ showErr('A', err); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#modal').hidden){ closeModal(); return; }
  const el = e.target.closest && e.target.closest('[data-act]');
  if(el && el.tagName!=='BUTTON' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); try{ act(el); }catch(err){ showErr('K', err); } }
});
$('#btnBack').onclick = back;
$('#btnIsland').onclick = ()=>go('home');
$('#btnEnroll').onclick = ()=>go('enroll');
$('#btnSet').onclick = openSettings;
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

/* ---------- 紀念卡下載（在裝置上產生，不上傳） ---------- */
async function downloadMemo(){
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const d = memoData(), W = 1080, pad = 72, font = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    const cv = document.createElement('canvas'), x = cv.getContext('2d');
    const blocks = [];
    blocks.push({ t:'今天的小宇宙紀錄', s:58, w:700, c:'#18243B', g:8 });
    blocks.push({ t:'親子探索紀錄・非鑑定結果', s:30, w:400, c:'#44506a', g:36 });
    if(d.showParent){ blocks.push({ t:'家長留意到的片段', s:36, w:700, c:'#2c6a5b', g:10 });
      (d.parent.length?d.parent:['今天先留下一個觀察任務：找一件孩子願意主動投入的事，聽聽他為什麼喜歡。']).forEach(p=>blocks.push({ t:'・'+p, s:32, w:400, c:'#1c2638', g:6 })); blocks.push({gap:26}); }
    if(d.did.length){ blocks.push({ t:'孩子今天做了什麼', s:36, w:700, c:'#2c6a5b', g:10 });
      d.did.forEach(p=>blocks.push({ t:'・'+p, s:32, w:400, c:'#1c2638', g:6 }));
      d.free.forEach(p=>blocks.push({ t:'「'+p+'」', s:30, w:400, c:'#44506a', g:6 })); blocks.push({gap:26}); }
    if(d.talk.length){ blocks.push({ t:'下一次可以聊聊', s:36, w:700, c:'#2c6a5b', g:10 });
      d.talk.forEach(p=>blocks.push({ t:'・'+p, s:32, w:400, c:'#1c2638', g:6 })); blocks.push({gap:26}); }
    blocks.push({ t:'短短幾個任務，只能看見今天的一小部分。孩子的興趣、經驗與需要，可以在生活裡繼續了解。', s:28, w:400, c:'#44506a', g:6 });
    const wrap = (t,s,w)=>{ x.font = `${w} ${s}px ${font}`; const lines=[]; let cur=''; for(const ch of t){ if(x.measureText(cur+ch).width > W-pad*2){ lines.push(cur); cur=ch; } else cur+=ch; } if(cur) lines.push(cur); return lines; };
    let H = pad;
    blocks.forEach(b=>{ if(b.gap){ H+=b.gap; return; } b.lines = wrap(b.t,b.s,b.w); H += b.lines.length*b.s*1.5 + b.g; });
    H += pad + 60;
    cv.width = W; cv.height = H;
    x.fillStyle = '#18243B'; x.fillRect(0,0,W,H);
    x.fillStyle = '#FFF8EB'; roundRect(x,24,24,W-48,H-48,40); x.fill();
    x.strokeStyle = '#F4CF87'; x.lineWidth = 8; roundRect(x,24,24,W-48,H-48,40); x.stroke();
    let y = pad + 20;
    blocks.forEach(b=>{ if(b.gap){ y+=b.gap; return; } x.font = `${b.w} ${b.s}px ${font}`; x.fillStyle = b.c; x.textBaseline='top';
      b.lines.forEach(l=>{ x.fillText(l, pad, y); y += b.s*1.5; }); y += b.g; });
    x.font = `400 24px ${font}`; x.fillStyle = '#44506a'; x.fillText(`${CONFIG.school.name}資優班・看見小宇宙`, pad, H-pad-6);
    cv.toBlob(blob=>{
      if(!blob){ showErr('D', new Error('toBlob')); return; }
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = '看見小宇宙紀念卡.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      say('紀念卡已產生。');
    }, 'image/png');
  }catch(e){ showErr('D', e); }
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

/* ---------- 錯誤記錄積木 ---------- */
function showErr(tag, e){
  const code = `E-${tag}-${S.screen}-${Date.now().toString(36).slice(-4)}`;
  const box = $('#errbox');
  box.textContent = `出了點狀況，請截圖給老師：${code}｜${(e && e.message || e || '').toString().slice(0,60)}`;
  box.hidden = false; setTimeout(()=>{ box.hidden = true; }, 9000);
  try{ console.error(code, e); }catch(_){}
}
window.addEventListener('error', ev=>{ if(ev.target && ev.target.tagName==='IMG') return; showErr('W', ev.error||ev.message); });

/* ---------- 寬螢幕背景圖（選用） ---------- */
(function(){ const im = new Image(); im.onload = ()=>document.body.classList.add('has-wide-art'); im.src = 'assets/art/island-wide.webp'; })();

/* ---------- 測試積木：給自動測試呼叫 ---------- */
window.__GAME = {
  state: ()=>JSON.parse(JSON.stringify(S)), go, simulate, openings, memoData, CONFIG, G1_LEVELS, G2_ROUNDS, G3_ROUNDS, g3:()=>({phase:g3Phase,input:g3Input.slice()}),
  setRot: a=>{ S.g1.rot=a.slice(); g1Last=null; save(); render(); },
  run: runG1, reset: ()=>{ S=fresh(); hist=[]; g1Last=null; save(); render(); }
};

if(CONFIG.preview){ const f=document.createElement('div'); f.className='preview-flag'; f.textContent='開發預覽'; document.body.appendChild(f); }
applyPref();
render();
</script>
